# Cấu hình Cloudflare Worker cho Flowrite.
#
# Đổi "name" nếu bạn muốn địa chỉ Worker khác đi — địa chỉ cuối cùng sẽ là
# https://<name>.<tên-tài-khoản-cloudflare-của-bạn>.workers.dev

name = "flowrite-ai-worker"
main = "flowrite-ai-worker.js"
compatibility_date = "2024-09-01"

# GEMINI_API_KEY và APP_SHARED_SECRET KHÔNG khai ở đây — đó là bí mật, đặt
# bằng lệnh `wrangler secret put`, không bao giờ nằm trong tệp này (tệp này
# có thể lên GitHub, secret thì không).
#
# GEMINI_MODEL có thể đặt ở đây vì không phải bí mật — chỉ là tên model,
# đổi được bất cứ lúc nào bằng cách sửa dòng dưới rồi `wrangler deploy` lại.
[vars]
GEMINI_MODEL = "gemini-1.5-flash"
