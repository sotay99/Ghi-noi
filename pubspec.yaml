name: flowrite
description: Flowrite - trang van ban trang, go phim va noi bang micro cung luc.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0
  shared_preferences: ^2.3.2
  permission_handler: ^13.0.2
  path_provider: ^2.1.4
  share_plus: ^13.3.0
  http: ^1.2.0
  record: ^7.1.1
  audioplayers: ^6.1.0
  # (SỬA LỖI build đỏ) 8.x của file_picker kéo theo win32 ^5.x — xung đột
  # với share_plus (đòi win32 ^6.x) đã có sẵn trong app, `flutter pub get`
  # không giải được. Nâng lên 13.x (dùng win32 ^6.x) theo đúng gợi ý CI đưa
  # ra để hết xung đột.
  file_picker: ^13.1.0
  # Nén/giải nén .zip cho "Tải và chia sẻ thư mục này"/"Nhập tệp nén Zip vào
  # đây" — thuần Dart, chạy được cả trên web (không cần dart:io).
  archive: ^3.6.1
  # Mục "Chụp ảnh (camera)" (menu "Làm việc với AI") — mở thẳng camera thiết
  # bị (ImageSource.camera), khác `file_picker` chỉ mở được bộ chọn tệp có
  # sẵn. Hỗ trợ cả Android lẫn Web (trên Web mở input file có capture, trình
  # duyệt tự xin quyền camera).
  image_picker: ^1.1.2
  # Đăng nhập Google (nút "Đăng nhập tài khoản" ở menu "Tài khoản và Cài
  # đặt") — firebase_core khởi tạo kết nối tới project `flowrite219` (đã
  # dùng sẵn cho Firebase Hosting), firebase_auth giữ trạng thái đăng nhập,
  # google_sign_in lấy thông tin tài khoản Google bên Android (Web dùng
  # thẳng `signInWithPopup` của firebase_auth, không cần gói này).
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  # Bộ nhớ đám mây (cây thư mục/ghi chú đồng bộ theo tài khoản Google) —
  # xem `lib/dong_bo_dam_may.dart`.
  cloud_firestore: ^5.4.4
  # (YÊU CẦU MỚI) Mở link ở trình duyệt ngoài trên APK — nút "Mở link" của
  # gạch chân xanh dương (xem `lib/mo_lien_ket_ngoai_io.dart`). Web vẫn dùng
  # thẳng `dart:html` (không cần gói này).
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^4.0.0

# objective_c 9.6.1 (phát hành vài giờ trước bản build này) lỗi thật — thiếu
# Architecture.arm64e mà chính SDK Dart bó theo Flutter hiện dùng không có.
# Gói này chỉ phục vụ record_darwin (macOS/iOS), app này chỉ build Android,
# nhưng vẫn bị kéo vào cây phụ thuộc và làm gãy bước biên dịch. Ghim đè về
# 9.6.0 (bản ổn định ngay trước đó) cho tới khi bản vá xuất hiện.
dependency_overrides:
  objective_c: 9.6.0

flutter:
  uses-material-design: true
  # Logo Flowrite (trang giấy bẻ góc + bút + sóng âm) — dùng ở Hero của
  # trang Hướng dẫn (xem `lib/trang_huong_dan.dart`). Icon app (Android/Web)
  # KHÔNG đi qua đường này — xem `tool/va_android.py`/`tool/va_web.py`.
  assets:
    - assets/logo.png
