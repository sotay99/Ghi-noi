name: Dựng bản Web ĐẦY ĐỦ (nhân bản app Android)

# Chạy khi bản Web đầy đủ (main_web_full.dart) hoặc bất kỳ file nào nó phụ
# thuộc (toàn bộ màn hình soạn thảo của app Android) đổi — tách biệt hoàn
# toàn khỏi build-apk.yml.
on:
  push:
    paths:
      - 'lib/main_web_full.dart'
      - 'lib/main.dart'
      - 'lib/trang_soan_thao.dart'
      - 'lib/cai_dat.dart'
      - 'lib/canh_bao_roi_trang.dart'
      - 'lib/canh_bao_roi_trang_io.dart'
      - 'lib/canh_bao_roi_trang_web.dart'
      - 'lib/loai_thiet_bi.dart'
      - 'lib/doan_thiet_bi.dart'
      - 'lib/doan_thiet_bi_io.dart'
      - 'lib/doan_thiet_bi_web.dart'
      - 'lib/ghi_am_the.dart'
      - 'lib/ghi_am_the_io.dart'
      - 'lib/ghi_am_the_web.dart'
      - 'lib/gui_ghi_am_gemini.dart'
      - 'lib/gui_anh_gemini.dart'
      - 'lib/gui_tom_tat_gemini.dart'
      - 'lib/gui_mo_rong_gemini.dart'
      - 'lib/gui_viet_lai_gemini.dart'
      - 'lib/gui_tro_chuyen_gemini.dart'
      - 'lib/man_hinh_tro_chuyen.dart'
      - 'lib/tin_nhan_tro_chuyen.dart'
      - 'lib/ket_qua_ghi_am_the.dart'
      - 'lib/kho_du_lieu.dart'
      - 'lib/kiem_tra_chinh_ta.dart'
      - 'lib/kiem_tra_toan_van.dart'
      - 'lib/man_hinh_cai_dat.dart'
      - 'lib/man_hinh_thu_muc.dart'
      - 'lib/modal_cai_dat_kiem_tra_toan_van.dart'
      - 'lib/modal_nghe_lai_ghi_am.dart'
      - 'lib/modal_tu_dien_nhap_lieu_nhanh.dart'
      - 'lib/mau_phim_tu_dien_nhap_lieu_nhanh.dart'
      - 'lib/dinh_dang_doan_van_tu_dien.dart'
      - 'lib/theo_doi_tap_doi_phim.dart'
      - 'lib/lua_chon_phim_tat.dart'
      - 'lib/nguon_am_thanh_the_ghi_am.dart'
      - 'lib/nguon_am_thanh_the_ghi_am_io.dart'
      - 'lib/nguon_am_thanh_the_ghi_am_web.dart'
      - 'lib/mau_co_ban.dart'
      - 'lib/mo_hinh.dart'
      - 'lib/phien_ban_web_day_du.dart'
      - 'lib/the_ghi_am.dart'
      - 'lib/tai_ve_ghi_chu.dart'
      - 'lib/tai_ve_ghi_chu_io.dart'
      - 'lib/tai_ve_ghi_chu_web.dart'
      - 'lib/thanh_cong_cu.dart'
      - 'lib/thong_bao_giua.dart'
      - 'lib/trang_huong_dan.dart'
      - 'lib/ai_cau_hinh.dart'
      - 'lib/firebase_options.dart'
      - 'lib/dang_nhap_google.dart'
      - 'lib/mo_hinh.dart'
      - 'lib/modal_chia_se_tep.dart'
      - 'lib/mo_lien_ket_ngoai.dart'
      - 'lib/mo_lien_ket_ngoai_web.dart'
      - 'lib/mo_lien_ket_ngoai_io.dart'
      - 'web_static/chia-se-tep.html'
      - 'web_static/gioi-thieu-vi.html'
      - 'web_static/gioi-thieu-en.html'
      - '.github/workflows/deploy-web-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dung-va-trien-khai-web-day-du:
    name: Dựng Flutter Web (bản đầy đủ) và đưa lên Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Xem phiên bản
        run: flutter --version

      - name: Bật hỗ trợ Flutter Web
        run: flutter config --enable-web

      - name: Tải thư viện
        run: flutter pub get

      - name: Soát mã (chỉ cảnh báo, không chặn build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # Thư mục web/ không nằm trong git — sinh động lúc CI chạy.
      - name: Sinh phần Web
        run: |
          set -e
          flutter create --platforms=web \
            --project-name=flowrite \
            --org=com.flowrite \
            /tmp/khung-web
          cp -r /tmp/khung-web/web ./web
          python3 tool/va_web.py .

      # BỎ HẲN Service Worker/offline — sau nhiều lần vá cơ chế "F5 luôn lấy
      # bản mới" cho chiến lược PWA mặc định (offline-first) mà vẫn không
      # chắc chắn (không kiểm chứng được trên trình duyệt thật, không đọc
      # được đúng những gì Flutter Web thực sự sinh ra), đổi hẳn sang
      # --pwa-strategy=none: không có tầng cache Service Worker nào chen
      # vào giữa nữa, F5 CHẮC CHẮN luôn lấy đúng bản mới nhất. Đánh đổi: mất
      # khả năng chạy khi mất mạng hoàn toàn — chấp nhận được cho một app
      # ghi chú dùng hằng ngày có mạng bình thường.
      # --source-maps: để Chrome DevTools tự dịch lỗi từ tên rút gọn
      # (minified:xx) ra đúng tên file/dòng Dart thật — không đổi gì hành vi
      # chạy thật của app, chỉ giúp đọc lỗi trên Console dễ hơn khi cần.
      - name: Dựng bản Web (entry point riêng cho bản đầy đủ, KHÔNG offline)
        run: |
          flutter build web \
            --target=lib/main_web_full.dart \
            --base-href / \
            --pwa-strategy=none \
            --source-maps

      # (YÊU CẦU MỚI — "Chia sẻ tệp bằng đường link") Trang HTML tĩnh xem
      # tệp công khai, KHÔNG phải Flutter — chép thẳng vào build/web, rewrite
      # ở bước "Tạo cấu hình Firebase Hosting" bên dưới sẽ trỏ mọi đường dẫn
      # một đoạn (/<mã chia sẻ>) về đây TRƯỚC rule "**" của Flutter.
      - name: Chép trang tĩnh "Chia sẻ tệp bằng đường link"
        run: cp web_static/chia-se-tep.html build/web/chia-se-tep.html

      # (YÊU CẦU MỚI — trang giới thiệu SEO) HTML tĩnh THẬT (không phải
      # Flutter) để Google index tốt — đặt dưới /gioi-thieu/vi và
      # /gioi-thieu/en (path segment, không phải ?lang=), rewrite ở bước
      # "Tạo cấu hình Firebase Hosting" bên dưới trỏ TRƯỚC rule "**".
      - name: Chép trang tĩnh "Giới thiệu" (SEO, đa ngôn ngữ)
        run: |
          mkdir -p build/web/gioi-thieu/vi build/web/gioi-thieu/en
          cp web_static/gioi-thieu-vi.html build/web/gioi-thieu/vi/index.html
          cp web_static/gioi-thieu-en.html build/web/gioi-thieu/en/index.html

      # Đưa thẳng lên channel "live" — địa chỉ chính flowrite219.web.app,
      # vĩnh viễn, không hết hạn (khác channel xem trước "day-du"/tên nhánh,
      # gia hạn 7-30 ngày mỗi lần đẩy nhưng vẫn có ngày hết nếu ngừng đẩy).
      # Bản phòng thí nghiệm cũ đã gỡ nên channel "live" của project này
      # không còn ai khác dùng.
      - name: Tạo cấu hình Firebase Hosting
        run: |
          cat > firebase.json << 'EOF'
          {
            "hosting": {
              "public": "build/web",
              "ignore": ["firebase.json", "**/.*"],
              "rewrites": [
                { "source": "/gioi-thieu/vi", "destination": "/gioi-thieu/vi/index.html" },
                { "source": "/gioi-thieu/en", "destination": "/gioi-thieu/en/index.html" },
                { "source": "/:ma", "destination": "/chia-se-tep.html" },
                { "source": "**", "destination": "/index.html" }
              ],
              "headers": [
                {
                  "source": "/index.html",
                  "headers": [
                    { "key": "Cache-Control", "value": "no-cache" }
                  ]
                },
                {
                  "source": "/flutter_service_worker.js",
                  "headers": [
                    { "key": "Cache-Control", "value": "no-cache" }
                  ]
                },
                {
                  "source": "/version.json",
                  "headers": [
                    { "key": "Cache-Control", "value": "no-cache" }
                  ]
                },
                {
                  "source": "**/*.js",
                  "headers": [
                    { "key": "Cache-Control", "value": "no-cache" }
                  ]
                }
              ]
            }
          }
          EOF
          cat > .firebaserc << 'EOF'
          {
            "projects": {
              "default": "flowrite219"
            }
          }
          EOF

      # Nhánh "thu-nghiem/" KHÔNG đưa lên channel "live" (bản chính thức) —
      # đưa vào một channel xem trước riêng, tên suy từ tên nhánh (đổi "/"
      # thành "-" vì channel Firebase không cho phép "/"), hạn 7 ngày, mỗi
      # lần đẩy của đúng nhánh đó gia hạn thêm — giữ nguyên địa chỉ.
      - name: Chọn channel Hosting theo nhánh
        id: chon-channel
        run: |
          if [[ "${{ github.ref_name }}" == thu-nghiem/* ]]; then
            TEN="${{ github.ref_name }}"
            echo "id=preview-${TEN//\//-}" >> "$GITHUB_OUTPUT"
          else
            echo "id=live" >> "$GITHUB_OUTPUT"
          fi

      - name: Đưa build/web lên Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: ${{ steps.chon-channel.outputs.id }}
          expires: ${{ steps.chon-channel.outputs.id != 'live' && '7d' || '' }}
          projectId: flowrite219
