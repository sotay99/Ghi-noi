name: Dựng bản thử micro Web

# Chỉ chạy khi CHÍNH bản thử web (lib/main_web_test.dart) hoặc workflow này
# đổi — tách biệt hoàn toàn khỏi build-apk.yml, không tự chạy lại mỗi khi
# code Android khác thay đổi.
on:
  push:
    paths:
      - 'lib/main_web_test.dart'
      - '.github/workflows/deploy-web-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dung-va-trien-khai-web:
    name: Dựng Flutter Web và đưa lên Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      # Đúng cách cài Flutter như build-apk.yml, để nhất quán phiên bản giữa
      # hai workflow.
      - name: Cài Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Xem phiên bản
        run: flutter --version

      - name: Bật hỗ trợ Flutter Web
        run: flutter config --enable-web

      - name: Tải thư viện
        run: flutter pub get

      - name: Soát mã (chỉ cảnh báo, không chặn build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # Thư mục web/ không nằm trong git (y hệt lý do android/ không nằm
      # trong git ở build-apk.yml) — "This project is not configured for
      # the web." nếu thiếu bước này. Sinh nó bằng đúng phiên bản Flutter
      # vừa cài, sang một thư mục tạm rồi chỉ chép phần web/ vào, tránh
      # đụng tới bất kỳ file nào khác của repo.
      - name: Sinh phần Web
        run: |
          set -e
          flutter create --platforms=web \
            --project-name=flowrite \
            --org=com.flowrite \
            /tmp/khung-web
          cp -r /tmp/khung-web/web ./web

      # Firebase Hosting phục vụ ở domain gốc (flowrite219.web.app),
      # không có tiền tố đường dẫn con như GitHub Pages, nên base-href
      # phải là gốc "/".
      - name: Dựng bản Web (entry point riêng cho bản thử)
        run: |
          flutter build web \
            --target=lib/main_web_test.dart \
            --base-href /

      # Repo riêng tư nên GitHub Pages miễn phí không dùng được (chỉ hỗ
      # trợ repo công khai) — chuyển sang Firebase Hosting. Hai file cấu
      # hình này không commit vào repo, chỉ sinh động lúc CI chạy, y hệt
      # cách web/ ở trên cũng không nằm trong git.
      - name: Tạo cấu hình Firebase Hosting
        run: |
          # `index.html`, `flutter_service_worker.js` và `version.json` phải
          # LUÔN được trình duyệt hỏi lại máy chủ (no-cache = "kiểm tra lại
          # trước khi dùng", không phải "đừng lưu") — đây là ba tệp Flutter
          # Web dùng để phát hiện có bản mới hay không lúc F5. Không đặt
          # header này thì trình duyệt có thể tự ý dùng bản `index.html` cũ
          # trong cache HTTP của nó mà không hề hỏi lại, nên bấm F5 vẫn thấy
          # bản cũ dù server đã có bản mới. Các tệp còn lại (main.dart.js,
          # ảnh, font...) đều có vân tay trong tên do chính service worker
          # quản lý nên giữ cache dài hạn bình thường, không cần khai riêng.
          #
          # Đây KHÔNG tắt khả năng dùng ngoại tuyến: service worker của
          # Flutter vẫn giữ nguyên (không đổi `--pwa-strategy`), nên khi mất
          # mạng, trình duyệt không gọi được máy chủ để "kiểm tra lại" thì
          # tự động dùng bản đã lưu trong cache của service worker — người
          # dùng vẫn mở được trang và tài liệu đang soạn (tự lưu ở
          # localStorage, xem `_khoiPhucVanBanDaLuu`) vẫn còn nguyên.
          cat > firebase.json << 'EOF'
          {
            "hosting": {
              "public": "build/web",
              "ignore": ["firebase.json", "**/.*"],
              "rewrites": [
                { "source": "**", "destination": "/index.html" }
              ],
              "headers": [
                {
                  "source": "/index.html",
                  "headers": [
                    { "key": "Cache-Control", "value": "no-cache" }
                  ]
                },
                {
                  "source": "/flutter_service_worker.js",
                  "headers": [
                    { "key": "Cache-Control", "value": "no-cache" }
                  ]
                },
                {
                  "source": "/version.json",
                  "headers": [
                    { "key": "Cache-Control", "value": "no-cache" }
                  ]
                }
              ]
            }
          }
          EOF
          cat > .firebaserc << 'EOF'
          {
            "projects": {
              "default": "flowrite219"
            }
          }
          EOF

      - name: Đưa build/web lên Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: flowrite219
